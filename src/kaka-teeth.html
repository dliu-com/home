    <main class="dl-main dl-narrow">

        <section class="dl-card task-panel child-task-panel" data-task="kaka-teeth" aria-labelledby="kaka-teeth-heading">
            <h1 id="kaka-teeth-heading">Brush Kaka's teeth</h1>
            <p>Record the time after brushing Kaka's teeth.</p>
            <button class="dl-button dl-button-primary" data-action="record" type="button">
                Record Kaka 刷牙
            </button>
            <p class="message" data-role="message" role="status" aria-live="polite"></p>

            <section class="status-section" aria-labelledby="kaka-teeth-status-heading">
                <h2 id="kaka-teeth-status-heading">100-hour status</h2>
                <div class="status-card loading" data-role="status">Loading&hellip;</div>
            </section>

            <section aria-labelledby="kaka-teeth-history-heading">
                <div class="history-heading">
                    <h2 id="kaka-teeth-history-heading">Kaka teeth-brushing history</h2>
                    <button class="dl-button dl-button-small" data-action="refresh" type="button">
                        Refresh
                    </button>
                </div>
                <p data-role="empty" hidden>Kaka's teeth brushing has not been recorded yet.</p>
                <ol class="timestamp-list" data-role="history" aria-live="polite"></ol>
            </section>
        </section>
